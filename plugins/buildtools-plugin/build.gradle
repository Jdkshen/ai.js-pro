apply plugin: 'com.android.application'

// Optional heavy toolchain plugin. It is intentionally UI-less and only publishes
// descriptors/component metadata for the host terminal and MCP. Compiler binaries are
// installed as optional data packages; this APK stays small.
def pluginSigningValues = [
        storeFile    : System.getenv('AIJSPRO_KEYSTORE'),
        storePassword: System.getenv('AIJSPRO_STORE_PASSWORD'),
        keyAlias     : System.getenv('AIJSPRO_KEY_ALIAS'),
        keyPassword  : System.getenv('AIJSPRO_KEY_PASSWORD')
]
def pluginSigningReady = pluginSigningValues.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.jdkshen.buildtools.plugin'
    compileSdkVersion versions.compile
    buildToolsVersion versions.buildTool

    defaultConfig {
        applicationId 'com.jdkshen.buildtools.plugin'
        minSdkVersion versions.mini
        targetSdkVersion versions.target
        versionCode versions.buildToolsPluginVersionCode
        versionName versions.buildToolsPluginVersionName
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        if (pluginSigningReady) {
            release {
                storeFile file(pluginSigningValues.storeFile)
                storePassword pluginSigningValues.storePassword
                keyAlias pluginSigningValues.keyAlias
                keyPassword pluginSigningValues.keyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            if (pluginSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError false }
}

dependencies {
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.json:json:20240303'
}
