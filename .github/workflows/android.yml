name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Build common release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleCommonRelease --no-daemon

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-js-pro-common-release-apks
          path: app/build/outputs/apk/common/release/*.apk
          if-no-files-found: error
