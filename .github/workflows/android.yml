name: Android CI and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build-time Python deps
        run: python3 -m pip install -r requirements-build.txt

      - name: Test and build Miuix compat/lite APKs
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:testMiuixCompatDebugUnitTest \
            :app:testMiuixLiteDebugUnitTest \
            :app:lintMiuixCompatDebug \
            :app:assembleMiuixCompatDebug \
            :app:assembleMiuixLiteDebug \
            :apkbuilder-plugin:assembleDebug \
            --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-js-pro-miuix-debug-apks
          path: apps/app/build/outputs/apk/miuix*/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify tag matches Android version
        shell: bash
        run: |
          expected="v$(jq -r .appVersionName project-versions.json)+$(jq -r .appVersionCode project-versions.json)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag must be $expected, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Restore release keystore
        shell: bash
        env:
          AIJSPRO_KEYSTORE_BASE64: ${{ secrets.AIJSPRO_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$AIJSPRO_KEYSTORE_BASE64" ]]; then
            echo "Missing AIJSPRO_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          printf '%s' "$AIJSPRO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aijspro-release.jks"

      - name: Build signed release APKs
        shell: bash
        env:
          AIJSPRO_KEYSTORE: ${{ runner.temp }}/aijspro-release.jks
          AIJSPRO_STORE_PASSWORD: ${{ secrets.AIJSPRO_STORE_PASSWORD }}
          AIJSPRO_KEY_ALIAS: ${{ secrets.AIJSPRO_KEY_ALIAS }}
          AIJSPRO_KEY_PASSWORD: ${{ secrets.AIJSPRO_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:assembleMiuixCompatRelease \
            :app:assembleMiuixLiteRelease \
            :apkbuilder-plugin:assembleRelease \
            --no-daemon

      - name: Collect the packaging plugin APK
        shell: bash
        run: |
          # 打包页按固定文件名 apkbuilder-plugin.apk 从 releases/latest/download 取它
          # （见 apps/app/.../network/PluginDownloads.java），所以这里必须改名。
          mkdir -p dist
          cp plugins/apkbuilder-plugin/build/outputs/apk/release/*.apk dist/apkbuilder-plugin.apk

      - name: Generate checksums
        shell: bash
        run: |
          find apps/app/build/outputs/apk/miuixCompat/release \
               apps/app/build/outputs/apk/miuixLite/release \
               -maxdepth 1 -type f -name '*.apk' -print0 \
            | sort -z \
            | xargs -0 sha256sum > AI-js-Pro-SHA256SUMS.txt
          sha256sum dist/apkbuilder-plugin.apk >> AI-js-Pro-SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/app/build/outputs/apk/miuixCompat/release/*.apk \
            apps/app/build/outputs/apk/miuixLite/release/*.apk \
            dist/apkbuilder-plugin.apk \
            AI-js-Pro-SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "AI.js Pro $(jq -r .appVersionName project-versions.json)"
