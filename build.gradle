import groovy.json.JsonSlurper

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.3.10'
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.jakewharton:butterknife-gradle-plugin:9.0.0-rc2'
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    configurations.all {
        resolutionStrategy.force 'androidx.core:core:1.0.2'
        resolutionStrategy.force 'androidx.annotation:annotation:1.0.2'
        resolutionStrategy.force 'androidx.vectordrawable:vectordrawable:1.1.0'
        resolutionStrategy.force 'androidx.vectordrawable:vectordrawable-animated:1.1.0'
        resolutionStrategy.force 'androidx.collection:collection:1.1.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-viewmodel:2.2.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-runtime:2.2.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-livedata-core:2.2.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-common:2.2.0'
        resolutionStrategy.force 'androidx.arch.core:core-runtime:2.1.0'
        resolutionStrategy.force 'androidx.arch.core:core-common:2.1.0'
        resolutionStrategy.force 'androidx.versionedparcelable:versionedparcelable:1.1.0'
        resolutionStrategy.force 'androidx.appcompat:appcompat:1.0.2'
        resolutionStrategy.force 'androidx.fragment:fragment:1.0.0'
        resolutionStrategy.force 'androidx.activity:activity:1.0.0'
        resolutionStrategy.force 'androidx.appcompat:appcompat-resources:1.0.2'
        resolutionStrategy.force 'androidx.savedstate:savedstate:1.0.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.2.0'
        resolutionStrategy.force 'androidx.preference:preference:1.0.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    versions = new JsonSlurper().parse(file('./project-versions.json'))
}
