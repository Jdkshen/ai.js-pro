import groovy.json.JsonSlurper

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.force 'androidx.core:core:1.13.1'
        resolutionStrategy.force 'androidx.annotation:annotation:1.7.1'
        resolutionStrategy.force 'androidx.vectordrawable:vectordrawable:1.1.0'
        resolutionStrategy.force 'androidx.vectordrawable:vectordrawable-animated:1.1.0'
        resolutionStrategy.force 'androidx.collection:collection:1.4.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-runtime:2.7.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-livedata-core:2.7.0'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-common:2.7.0'
        resolutionStrategy.force 'androidx.arch.core:core-runtime:2.2.0'
        resolutionStrategy.force 'androidx.arch.core:core-common:2.2.0'
        resolutionStrategy.force 'androidx.versionedparcelable:versionedparcelable:1.1.1'
        resolutionStrategy.force 'androidx.appcompat:appcompat:1.7.0'
        resolutionStrategy.force 'androidx.fragment:fragment:1.6.2'
        resolutionStrategy.force 'androidx.activity:activity:1.8.2'
        resolutionStrategy.force 'androidx.appcompat:appcompat-resources:1.7.0'
        resolutionStrategy.force 'androidx.savedstate:savedstate:1.2.1'
        resolutionStrategy.force 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.7.0'
        resolutionStrategy.force 'androidx.preference:preference:1.2.1'
        resolutionStrategy.force 'androidx.drawerlayout:drawerlayout:1.1.0'
        resolutionStrategy.force 'androidx.recyclerview:recyclerview:1.3.2'
        resolutionStrategy.force 'com.google.android.material:material:1.12.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Keep all modules on Java 8 bytecode regardless of the JDK running Gradle.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
            }
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '1.8'
                }
            }
        }
    }
}

ext {
    versions = new JsonSlurper().parse(file('./project-versions.json'))
}
