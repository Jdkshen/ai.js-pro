## Project-wide Gradle settings.

# JVM arguments for the daemon process
org.gradle.jvmargs=-Xms256m -Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Allow this legacy Android Gradle Plugin to build from the current Chinese path.
android.overridePathCheck=true

# Legacy R class behavior: library modules reference dependency resources
# (e.g. androidx.appcompat styles) through their own R class.
android.nonTransitiveRClass=false
# Switch-case statements over R.id.* require compile-time constants.
android.nonFinalResIds=false

# Keep the resource entry names inside the built APK (res/mipmap/ic_launcher.png instead
# of res/GX.png). The packaging pipeline rewrites the template's launcher icon/splash
# drawable by path, which is impossible when AGP shortens resource file names.
android.enableResourceOptimizations=false
