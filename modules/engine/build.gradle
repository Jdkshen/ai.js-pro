apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.stardust.autojs'
    compileSdkVersion versions.compile
    buildToolsVersion versions.buildTool
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdkVersion versions.mini
        targetSdkVersion versions.target
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // Script-loaded Kotlin compilers call kotlin.reflect.full while delegating
    // stdlib classes to the application. Keep the full reflection implementation
    // on that same loader and version instead of mixing it with a dex's copy.
    api "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    // Regression coverage for the command-line argument reflection used by the
    // unmodified JavaKotlin2Dex compiler. This compiler is only on the test path.
    testImplementation('org.jetbrains.kotlin:kotlin-compiler-embeddable') {
        version { strictly '1.6.21' }
    }
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.1-alpha01', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    testImplementation 'junit:junit:4.12'
    api fileTree(dir: 'libs', include: ['*.jar'])
    api 'org.greenrobot:eventbus:3.0.0'
    api 'net.lingala.zip4j:zip4j:1.3.2'
    api('com.afollestad.material-dialogs:core:0.9.2.3', {
        exclude group: 'com.android.support'
    })
    api 'com.google.android.material:material:1.1.0-alpha01'
    api project(':enhancedfloaty')
    api 'com.makeramen:roundedimageview:2.3.0'
    // Official OpenCV 5.0.0 Java AAR with native libraries replaced from the
    // official 16kb-page-fix Android SDK release asset.
    api(name: 'opencv-5.0.0-16kb-page-fix', ext: 'aar')
    // OkHttp
    api 'com.squareup.okhttp3:okhttp:3.10.0'
    // JDeferred
    api 'org.jdeferred:jdeferred-android-aar:1.2.6'
    //RootShell
    api project(':rootshell')
    // Gson
    api 'com.google.code.gson:gson:2.8.2'
    // log4j
    api group: 'de.mindpipe.android', name: 'android-logging-log4j', version: '1.0.3'
    api group: 'log4j', name: 'log4j', version: '1.2.17'
    // Background shells use ProcessBuilder. The legacy Jackpal terminal AARs
    // only contain obsolete ABIs and must not be restored to arm64 builds.
    // Rhino execution is packaged by the optional :engine-rhino module.
    // Core still compiles against its types while legacy APIs are being isolated.
    // SPIKE(2026-10-05): 升级试验——官方 Rhino 1.7.15.1（Android 兼容；回退改回 rhino-1.7.7.2.jar 即可）
    compileOnly files('../rhino-language/libs/rhino-1.7.15.1.jar')
    testImplementation files('../rhino-language/libs/rhino-1.7.15.1.jar')
    api project(path: ':common')
    api project(path: ':automator')
    // Shizuku client API. shell(..., { shizuku: true }) uses the Shizuku
    // process bridge to execute commands with ADB shell / Sui privileges.
    // 11.0.3 preserves this app's Android 5.x installation compatibility while
    // remaining compatible with current Shizuku servers.
    api 'dev.rikka.shizuku:api:11.0.3'
    // PDF §2.22 OCR：$ocr.create() / OCR.detect 的文字识别引擎。
    // Pro 用插件商店的 PaddleOCR，这里换成 ML Kit 中文模型（内置、离线、无需额外下载）。
    api 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // ApkBuilder
    api project(path: ':apkbuilder')
}
