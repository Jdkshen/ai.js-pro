// 象棋工程源码的版本指纹：project.json 是唯一版本源，清单里是逐文件 SHA-256。
// 工程本身不随宿主 APK 打包（宿主带的是 plugins/xiangqi-plugin），
// 这里生成清单是为了让插件构建与发布校验都能核对「打出去的那份工程代码 = 源码」。
tasks.register('prepareXiangqiRelease', Exec) {
    group = 'build'
    workingDir rootProject.projectDir
    commandLine 'python', rootProject.file('tools/xiangqi-release.py').absolutePath, 'prepare'
}
