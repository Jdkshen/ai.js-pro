// task-107/109/119：瘦身打包模板校验（assets/template.apk 无 lib/ + runtime assets 二次瘦身 + excluded 清单齐全 + AXML 包名检测）
tasks.register("verifySlimPackagingTemplate") {
    doLast {
        def assetsDir = file("src/main/assets")
        def template = new File(assetsDir, "template.apk")
        if (!template.isFile()) {
            throw new GradleException("缺少瘦身打包模板：apps/app/src/main/assets/template.apk（运行 inrt 瘦身模板生成步骤）")
        }
        long size = template.length()
        // task-119：剔除 source-engine-upgrade（libnode 97MB 未压缩）与 new_api_database.ser 后约 16.4MB；
        // 允许 6~20MB（下限给未来再瘦身留余量，上限防止把全量 lib/ 模板误带回来）。
        if (size < 6L * 1024 * 1024 || size > 20L * 1024 * 1024) {
            throw new GradleException("瘦身模板体积异常：" + size + " 字节（预期 6-20MB，不含 lib/）")
        }
        def excluded = new File(assetsDir, "excluded-zip-files.json")
        if (!excluded.isFile()) {
            throw new GradleException("缺少 excluded-zip-files.json（记录从宿主 APK 补齐的 lib 清单）")
        }
        def json = new groovy.json.JsonSlurper().parse(excluded)
        ["general", "opencv", "v8"].each { key ->
            if (!(json[key] instanceof List)) {
                throw new GradleException("excluded-zip-files.json 缺少数组字段：" + key)
            }
        }
        if (json.general.isEmpty() && json.opencv.isEmpty()) {
            throw new GradleException("excluded-zip-files.json 的 general/opencv 不能同时为空")
        }
        def zip = new java.util.zip.ZipFile(template)
        try {
            def names = new ArrayList<String>()
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                names.add(entry.name)
                if (entry.name.startsWith("lib/")) {
                    throw new GradleException("瘦身模板不能包含 lib/ 条目：" + entry.name)
                }
            }
            ["AndroidManifest.xml", "classes.dex", "resources.arsc"].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("瘦身模板缺少必需条目：" + required)
                }
            }
            // task-109：AXML 是二进制，不能整段按 UTF-16 文本搜；在原始字节里按 AXML 字符串池
            // 的两种编码（UTF-8 / UTF-16LE）分别搜包名，找不到只 warn 不阻断（大小/条目已硬校验）。
            def manifestBytes = zip.getInputStream(zip.getEntry("AndroidManifest.xml")).getBytes()
            def containsBytes = { byte[] data, byte[] needle ->
                if (needle.length == 0 || data.length < needle.length) return false
                for (int i = 0; i <= data.length - needle.length; i++) {
                    boolean match = true
                    for (int j = 0; j < needle.length; j++) {
                        if (data[i + j] != needle[j]) { match = false; break }
                    }
                    if (match) return true
                }
                return false
            }
            def name = "com.stardust.autojs.inrt"
            boolean packageFound = containsBytes(manifestBytes, name.getBytes("UTF-8"))
                    || containsBytes(manifestBytes, name.getBytes("UTF-16LE"))
            if (!packageFound) {
                // ASCII 日志：Windows 控制台/构建日志编码可能是 GBK，中文 warn 会乱码；
                // 包名找不到只 warn 不阻断（大小/entry/lib 已硬校验），中文原因留在异常里。
                logger.warn("C-PKG: package name not found in AXML string pool, skip package check; "
                        + "size/entries/lib checks passed")
            }
            logger.lifecycle("C-PKG: slim template OK size=" + size + " entries=" + names.size()
                    + " package=" + (packageFound ? name : "unverified")
                    + " general=" + json.general.size() + " opencv=" + json.opencv.size()
                    + " v8=" + json.v8.size())
        } finally {
            zip.close()
        }
    }
}
tasks.configureEach { t ->
    if (t.name == "preBuild") {
        // 瘦身模板是本地产物（*.apk 被 .gitignore 忽略，CI/全新 clone 里没有）：
        // 只有文件存在时才挂校验，避免 CI 因缺模板在第一个任务就失败（历史上 74 连红的根因）。
        // 本地构建仍会跑完整校验；CI 跳过的是「生成物存在性检查」，不影响 APK 构建本身。
        if (file("src/main/assets/template.apk").isFile()) {
            t.dependsOn("verifySlimPackagingTemplate")
        } else {
            logger.lifecycle("C-TEMPLATE: slim template not present; skip verifySlimPackagingTemplate (generated asset)")
        }
    }
}
