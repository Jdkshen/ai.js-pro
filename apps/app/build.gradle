tasks.register('verifyQuickJsNativeLibrariesFresh') {
    group = 'verification'
    description = 'Prevent packaging stale native libraries after native source changes.'
    inputs.files(quickJsNativeSources)
    inputs.files(quickJsNativeLibraries)

    doLast {
        def missing = quickJsNativeLibraries.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException('Native libraries are missing:\n' +
                    missing.collect { ' - ' + it }.join('\n'))
        }
        def newestSourceTime = quickJsNativeSources.collect { it.lastModified() }.max()
        def stale = quickJsNativeLibraries.findAll { it.lastModified() < newestSourceTime }
        if (!stale.isEmpty()) {
            throw new GradleException('Native libraries are older than their sources. Run ' +
                    'modules/engine/src/main/cpp/build-quickjs.ps1 before Gradle packaging:\n' +
                    stale.collect { ' - ' + it }.join('\n'))
        }
    }
}

