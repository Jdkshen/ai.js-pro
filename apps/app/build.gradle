    debugImplementation 'com.squareup.leakcanary:leakcanary-support-fragment:1.6.1'
    implementation project(':automator')
    implementation project(':common')
    implementation project(':autojs')
    implementation 'dev.rikka.shizuku:provider:11.0.3'
    implementation project(':apkbuilder')
}

def bundledSampleDir = file('src/main/assets/sample')

tasks.register('verifyBundledSamplesNoNode') {
    group = 'verification'
    description = 'Reject Node.js entry scripts and node_modules from bundled Auto.js samples.'
    inputs.dir(bundledSampleDir)

    doLast {
        def forbiddenPaths = fileTree(bundledSampleDir).files.findAll { sample ->
            bundledSampleDir.toPath().relativize(sample.toPath()).any { segment ->
                segment.toString() ==~ /(?i)node_modules|nodejs.*|node\.js/
            }
        }
        def nodeEntries = fileTree(bundledSampleDir) {
            include '**/*.js'
        }.files.findAll { sample ->
            def source = sample.getText('UTF-8').replaceFirst(/^\uFEFF/, '').trim()
            source ==~ /(?s)^["']nodejs["'];?\s*.*/
        }
        def offenders = (forbiddenPaths + nodeEntries).collect {
            bundledSampleDir.toPath().relativize(it.toPath()).toString()
        }.unique().sort()
        if (!offenders.isEmpty()) {
            throw new GradleException('Node.js content must not be bundled as Auto.js samples:\n' +
                    offenders.collect { ' - ' + it }.join('\n'))
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('verifyBundledSamplesNoNode')
}

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Require private signing inputs before building a distributable release.'
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException('Release signing is not configured. Set AIJSPRO_KEYSTORE, AIJSPRO_STORE_PASSWORD, AIJSPRO_KEY_ALIAS and AIJSPRO_KEY_PASSWORD.')
        }
        if (!file(releaseSigningValues.storeFile).isFile()) {
            throw new GradleException('AIJSPRO_KEYSTORE does not point to a readable keystore file.')
        }
    }
}

tasks.matching { it.name == 'assembleMiuixRelease' }.configureEach {
    dependsOn tasks.named('verifyReleaseConfiguration')
}
