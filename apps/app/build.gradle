apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseSigningValues = [
        storeFile    : System.getenv('AIJSPRO_KEYSTORE'),
        storePassword: System.getenv('AIJSPRO_STORE_PASSWORD'),
        keyAlias     : System.getenv('AIJSPRO_KEY_ALIAS'),
        keyPassword  : System.getenv('AIJSPRO_KEY_PASSWORD')
]
def releaseSigningReady = releaseSigningValues.values().every { it != null && !it.trim().isEmpty() }

// VS Code「Auto.js Pro 扩展」的 USB 自动发现要求本应用声明一个与真 Auto.js Pro
// 相同 authority 的 provider（org.autojs.autojspro.debug.provider），代价是：
// 同机安装了真 Auto.js Pro 的设备无法安装/更新本应用（INSTALL_FAILED_CONFLICTING_PROVIDER）。
// 需要避开冲突时用 -PdevPluginUsbDiscovery=false 构建（只去掉 provider；
// 扩展里「输入设备IP地址」的 LAN 连接路径不受影响）。
def devPluginUsbDiscovery = findProperty('devPluginUsbDiscovery') != 'false'

android {
    namespace 'com.jdkshen.aijspro'
    compileSdkVersion versions.compile
    buildToolsVersion versions.buildTool
    buildFeatures {
        buildConfig true
        compose true
    }
    defaultConfig {
        applicationId "com.jdkshen.aijspro"
        minSdkVersion versions.mini
        targetSdkVersion versions.target
        versionCode versions.appVersionCode
        versionName versions.appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [resourcePackageName: "com.jdkshen.aijspro"]
            }
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            // Keep shrinking disabled until reflection/JNI entry points have release coverage.
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = 'utf-8'
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }

    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.1'
    }

    flavorDimensions "channel", "engine"
    splits {

        // Configures multiple APKs based on ABI.
        abi {

            // Enables building multiple APKs per ABI.
            enable true

            // By default all ABIs are included, so use reset() and include to specify that we only
            // want APKs for the supported 32-bit and 64-bit ABIs.

            // Resets the list of ABIs that Gradle should create APKs for to none.
            reset()

            // Specifies a list of ABIs that Gradle should create APKs for.
            include "x86", "armeabi-v7a", "arm64-v8a"

            // Specifies that we do not want to also generate a universal APK that includes all ABIs.
            universalApk false
        }
    }
    productFlavors {
        // 只保留 Miuix 一条界靨线：common / coolapk 两个旧界面 flavor 已退役
        // （发布脚本与 CI 一直只用 miuix 变体），因此不再需要 MIUIX_PILOT 这类双轨开关。
        miuix {
            dimension "channel"
            minSdkVersion 26
            buildConfigField 'String', 'CHANNEL', '"common"'
        }
        compat {
            dimension "engine"
            buildConfigField 'boolean', 'RHINO_COMPAT', 'true'
        }
        lite {
            dimension "engine"
            buildConfigField 'boolean', 'RHINO_COMPAT', 'false'
            versionNameSuffix '-lite'
        }
    }
}

// 打包运行时模板已随「APK 打包插件」（plugins/apkbuilder-plugin）分发：
// 宿主 APK 不再包含 assets/template.apk，所以这里也不再需要依赖 :inrt:buildApkPlugin
// （模板的刷新改由那个插件模块的 mergeAssets 触发，见它的 build.gradle）。

// With -PdevPluginUsbDiscovery=false a manifest overlay removes the debug-server
// provider through the merger (tools:node="remove"). Manifest source directories
// cannot be task outputs, so the tiny overlay is written at configuration time.
if (!devPluginUsbDiscovery) {
    def devPluginOverlayDir = layout.buildDirectory.dir('generated/devplugin-no-usb').get().asFile
    devPluginOverlayDir.mkdirs()
    new File(devPluginOverlayDir, 'AndroidManifest.xml').setText('''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
          xmlns:tools="http://schemas.android.com/tools">
    <application>
        <provider
            android:name=".pluginclient.DebugServerProvider"
            tools:node="remove"/>
    </application>
</manifest>
''', 'UTF-8')
    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.sources.manifests?.addStaticManifestFile(
                    new File(devPluginOverlayDir, 'AndroidManifest.xml').absolutePath)
        }
    }
}

// Pikafish NNUE 权重（50MB）不再随宿主包分发：用象棋就走「象棋引擎插件」
// （plugins/xiangqi-plugin，自带权重），或者自己把 pikafish.nnue 放到
// files/、externalFiles/、/sdcard/xiangqi-p4/ 下。
// 开发时想验证「宿主自带权重」这条老路，加 -PwithPikafishNnue=true。
def pikafishNnueFile = rootProject.file('third-party/Pikafish/src/pikafish.nnue')
def pikafishAssetsDir = file("$buildDir/generated/pikafish-assets")
def bundlePikafishNnue = project.hasProperty('withPikafishNnue')
if (bundlePikafishNnue) {
    sourceSets.main.assets.srcDir(pikafishAssetsDir)
}
tasks.register('stagePikafishNnue', Sync) {
    onlyIf { bundlePikafishNnue }
    from({ pikafishNnueFile.isFile() ? [pikafishNnueFile] : [] })
    into(pikafishAssetsDir)
    doLast {
        if (!pikafishNnueFile.isFile()) {
            logger.warn('Pikafish NNUE missing: put pikafish.nnue in third-party/Pikafish/src before packaging arm64')
        }
    }
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn(tasks.named('stagePikafishNnue'))
}

// 随包字体是 ImGui 会用到的码位的子集（完整字体在 third-party/fonts）。
// 生成工具同时负责校验：ImGui 范围一变、或子集漏字，这里就会红。
