// ---- 16 KB 页对齐守卫（P0） -------------------------------------------------
// 检查 arm64 .so 的 PT_LOAD p_align 与 PT_GNU_RELRO 末尾是否满足 16 KB 页口径。
// 默认不挂到日常 assemble；只有 -Pverify16kb=true 时才在 debug 包构建完成后自动跑。
// 单独执行：.\gradlew.bat :app:verify16kbAlignment
// 指定现有产物：.\gradlew.bat :app:verify16kbAlignment -Pverify16kbApk=<apk>
// 严格 RELRO：加 -Pverify16kbStrictRelro=true（非白名单库 RELRO 不圆整即失败）。
def verify16kbOnAssemble = findProperty('verify16kb') == 'true'
def verify16kbStrictRelro = findProperty('verify16kbStrictRelro') == 'true'

tasks.register('verify16kbAlignment', Exec) {
    group = 'verification'
    description = '检查 arm64 .so 的 PT_LOAD / PT_GNU_RELRO 是否满足 16 KB 页对齐。'
    def requestedApk = findProperty('verify16kbApk')
    def apkPath = (requestedApk
            ? rootProject.file(requestedApk.toString()).absolutePath
            : layout.buildDirectory.file('outputs/apk/miuixCompat/debug/app-miuix-compat-arm64-v8a-debug.apk').get().asFile.absolutePath)
    def scriptPath = rootProject.file('tools/verify-16kb-alignment.ps1').absolutePath
    def scriptArgs = ['-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', scriptPath, '-Apk', apkPath]
    if (verify16kbStrictRelro) {
        scriptArgs += '-StrictRelro'
    }
    workingDir rootProject.projectDir
    commandLine(['powershell'] + scriptArgs)
    ignoreExitValue = true
    doFirst {
        if (!new File(apkPath).isFile()) {
            throw new GradleException("16KB 对齐校验找不到 APK：${apkPath}\n" +
                    '请先构建 :app:assembleMiuixCompatDebug，或用 -Pverify16kbApk=<apk 路径> 指定已有产物。')
        }
        println "16KB 对齐校验：${apkPath}"
    }
    doLast {
        def exitCode = executionResult.get().exitValue
        if (exitCode != 0) {
            throw new GradleException("16KB 对齐守卫未通过（退出码 ${exitCode}）。" +
                    '请查看上方表格：非白名单库的 LOAD p_align 必须 >= 0x4000；' +
                    'RELRO 末尾未圆整默认只提示，加 -Pverify16kbStrictRelro=true 可按严格口径拦截。')
        }
    }
}

if (verify16kbOnAssemble) {
    tasks.matching { it.name == 'assembleMiuixCompatDebug' }.configureEach {
        // 用 finalizedBy 而不是 dependsOn：要校验的是刚打出来的 APK。
        finalizedBy tasks.named('verify16kbAlignment')
    }
}

