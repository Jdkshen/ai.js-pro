tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Require private signing inputs before building a distributable release.'
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException('Release signing is not configured. Set AIJSPRO_KEYSTORE, AIJSPRO_STORE_PASSWORD, AIJSPRO_KEY_ALIAS and AIJSPRO_KEY_PASSWORD.')
        }
