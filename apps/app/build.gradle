def quickJsNativeSourceDir = rootProject.file('modules/engine/src/main/cpp')
def quickJsNativeSources = [
        'CMakeLists.txt',
        'quickjs_jni.cpp',
        'native_frame_store.cpp',
        'native_frame_store.h',
        'xiangqi_board_detector.cpp',
        'xiangqi_board_detector.h',
        'script_crypto.c',
        'ppocr/ppocr_jni.cpp',
        'ppocr/ppocr_engine.cpp',
        'ppocr/ppocr_engine.h',
        'ppocr/ppocrv5_dict.h'
].collect { new File(quickJsNativeSourceDir, it) }
def quickJsNativeLibraries = ['armeabi-v7a', 'arm64-v8a', 'x86'].collectMany { abi ->
    def names = ['libquickjs_jni.so', 'libaijscrypto.so']
    if (abi == 'arm64-v8a') {
        // PP-OCR（ncnn）只随包 arm64-v8a，其余 ABI 由 Java 侧回退到 ML Kit。
        names += 'libppocr.so'
    }
    names.collect { rootProject.file("modules/engine/src/main/jniLibs/${abi}/${it}") }
}

tasks.register('verifyQuickJsNativeLibrariesFresh') {
    group = 'verification'
    description = 'Prevent packaging stale native libraries after native source changes.'
    inputs.files(quickJsNativeSources)
    inputs.files(quickJsNativeLibraries)

    doLast {
        def missing = quickJsNativeLibraries.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException('Native libraries are missing:\n' +
                    missing.collect { ' - ' + it }.join('\n'))
        }
        def newestSourceTime = quickJsNativeSources.collect { it.lastModified() }.max()
        def stale = quickJsNativeLibraries.findAll { it.lastModified() < newestSourceTime }
        if (!stale.isEmpty()) {
            throw new GradleException('Native libraries are older than their sources. Run ' +
                    'modules/engine/src/main/cpp/build-quickjs.ps1 before Gradle packaging:\n' +
                    stale.collect { ' - ' + it }.join('\n'))
        }
    }
}

