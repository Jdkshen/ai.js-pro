apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseSigningValues = [
        storeFile    : System.getenv('AIJSPRO_KEYSTORE'),
        storePassword: System.getenv('AIJSPRO_STORE_PASSWORD'),
        keyAlias     : System.getenv('AIJSPRO_KEY_ALIAS'),
        keyPassword  : System.getenv('AIJSPRO_KEY_PASSWORD')
]
def releaseSigningReady = releaseSigningValues.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.jdkshen.aijspro'
    compileSdkVersion versions.compile
    buildToolsVersion versions.buildTool
    buildFeatures {
        buildConfig true
        compose true
    }
    defaultConfig {
        applicationId "com.jdkshen.aijspro"
        minSdkVersion versions.mini
        targetSdkVersion versions.target
        versionCode versions.appVersionCode
        versionName versions.appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField 'boolean', 'MIUIX_PILOT', 'false'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [resourcePackageName: "com.jdkshen.aijspro"]
            }
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            // Keep shrinking disabled until reflection/JNI entry points have release coverage.
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = 'utf-8'
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }

    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.1'
    }

    flavorDimensions "channel"
    splits {

        // Configures multiple APKs based on ABI.
        abi {

            // Enables building multiple APKs per ABI.
            enable true

            // By default all ABIs are included, so use reset() and include to specify that we only
            // want APKs for the supported 32-bit and 64-bit ABIs.

            // Resets the list of ABIs that Gradle should create APKs for to none.
            reset()

            // Specifies a list of ABIs that Gradle should create APKs for.
            include "x86", "armeabi-v7a", "arm64-v8a"

            // Specifies that we do not want to also generate a universal APK that includes all ABIs.
            universalApk false
        }
    }
    productFlavors {
        miuix {
            minSdkVersion 26
            buildConfigField 'String', 'CHANNEL', '"common"'
            buildConfigField 'boolean', 'MIUIX_PILOT', 'true'
        }
        common {
            buildConfigField "String", "CHANNEL", '"common"'
        }
        coolapk {
            buildConfigField "String", "CHANNEL", '"coolapk"'
        }
    }
}




repositories {
    flatDir {
        dirs rootProject.file('modules/autojs/libs')
    }
}

