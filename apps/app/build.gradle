tasks.register('verifyBundledSamplesNoNode') {
    group = 'verification'
    description = 'Reject Node.js entry scripts and node_modules from bundled Auto.js samples.'
    inputs.dir(bundledSampleDir)

    doLast {
        def forbiddenPaths = fileTree(bundledSampleDir).files.findAll { sample ->
            def relative = bundledSampleDir.toPath().relativize(sample.toPath())
            if (relative.iterator().hasNext()
                    && relative.iterator().next().toString() == 'Node 引擎') {
                return false
            }
            relative.any { segment ->
                segment.toString() ==~ /(?i)node_modules|nodejs.*|node\.js/
            }
        }
        // Node 引擎目录是「Auto.js Pro 原包示例集」的 Node.js 部分，允许 nodejs 入口；
        // 其余示例目录仍然禁止 Node 入口（历史约定：普通示例必须 Rhino/QuickJS 可跑）。
        def nodeEntries = fileTree(bundledSampleDir) {
            include '**/*.js'
        }.files.findAll { sample ->
            def relative = bundledSampleDir.toPath().relativize(sample.toPath()).toString()
            def firstSegment = relative.contains(File.separator)
                    ? relative.substring(0, relative.indexOf(File.separator))
                    : relative
            if (firstSegment == 'Node 引擎') {
                return false
            }
            def source = sample.getText('UTF-8').replaceFirst(/^\uFEFF/, '').trim()
            source ==~ /(?s)^["']nodejs["'];?\s*.*/
        }
        def offenders = (forbiddenPaths + nodeEntries).collect {
            bundledSampleDir.toPath().relativize(it.toPath()).toString()
        }.unique().sort()
        if (!offenders.isEmpty()) {
            throw new GradleException('Node.js content must not be bundled as Auto.js samples:\n' +
                    offenders.collect { ' - ' + it }.join('\n'))
        }
    }
}

tasks.register('verifyBundledYoloSamples') {
    group = 'verification'
    description = 'Ensure bundled YOLO samples match the OpenCV 5.0 DNN runtime and packaged model paths.'
    inputs.dir(bundledYoloSampleDir)

    doLast {
        def expectedAssets = [
                file('src/main/assets/sample/QuickJS 引擎/YOLO目标检测/DNN/models/yolo26_160.onnx'),
                file('src/main/assets/sample/QuickJS 引擎/YOLO目标检测/DNN/models/labels.txt')
        ]
        def missingAssets = expectedAssets.findAll { !it.isFile() }
        def staleReferences = fileTree(bundledYoloSampleDir) {
            include '**/*.js', '**/*.txt'
        }.files.findAll { sample ->
            def source = sample.getText('UTF-8')
            source.contains('NCNN版本') || source.contains('ONNX Runtime版本') ||
                    source.contains('asset://sample/YOLO目标检测/') ||
                    source.contains('"sample/YOLO目标检测/') ||
                    source.contains('/YOLO目标检测/YOLO目标检测/') ||
                    (sample.name.endsWith('.js') && (source =~ /backend\s*=\s*['"]opencv['"]/).find())
        }
        if (!missingAssets.isEmpty() || !staleReferences.isEmpty()) {
            def details = []
            details.addAll(missingAssets.collect { 'missing: ' + it })
            details.addAll(staleReferences.collect {
                'stale: ' + bundledSampleDir.toPath().relativize(it.toPath()).toString()
            })
            throw new GradleException('Bundled YOLO samples do not match OpenCV 5.0 DNN:\n' +
                    details.unique().sort().collect { ' - ' + it }.join('\n'))
        }
    }
}

tasks.register('verifyQuickJsSamplesMarked') {
    group = 'verification'
    description = 'Require every script shown under QuickJS samples to select QuickJS explicitly.'
    inputs.dir(bundledQuickJsSampleDir)

    doLast {
        def offenders = fileTree(bundledQuickJsSampleDir) {
            include '**/*.js'
        }.files.findAll { sample ->
            def source = sample.getText('UTF-8').replaceFirst(/^\uFEFF/, '')
            def firstLine = source.readLines().find { !it.trim().isEmpty() }
            if (firstLine == null) {
                return true
            }
            def line = firstLine.trim().toLowerCase()
            // 两种写法都认：引擎字符串指令（"quickjs";）或旧注释指令（// @engine quickjs）
            !line.contains('quickjs')
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('QuickJS sample is missing the first-line engine marker:\n' +
                    offenders.collect {
                        ' - ' + bundledQuickJsSampleDir.toPath().relativize(it.toPath()).toString()
                    }.sort().join('\n'))
        }
    }
}

