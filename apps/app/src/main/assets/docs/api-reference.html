<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>三引擎 API 文档 · AI.js Pro</title>
  <script src="api-reference-theme.js"></script>
  <link rel="stylesheet" href="api-reference.css">
  <script defer src="api-reference-data.js"></script>
  <script defer src="api-reference.js"></script>
</head>
<body>
  <header>
    <div class="topbar">
      <button id="back" class="icon-button" type="button" aria-label="返回">‹</button>
      <h1>API 文档</h1><span class="offline">离线可用</span>
    </div>
    <div class="search-row">
      <input id="search" type="search" aria-label="搜索方法、参数或示例" placeholder="搜索 API，如 files.read" autocomplete="off" spellcheck="false">
      <button id="filter-toggle" type="button" aria-controls="filters" aria-expanded="false">专题</button>
    </div>
    <nav id="engines" aria-label="选择引擎">
      <button type="button" data-engine="all" aria-pressed="true">全部</button>
      <button type="button" data-engine="rhino" aria-pressed="false">Rhino</button>
      <button type="button" data-engine="quickjs" aria-pressed="false">QuickJS</button>
      <button type="button" data-engine="nodejs" aria-pressed="false">Node.js</button>
    </nav>
    <div id="filters" hidden>
      <label class="category-label" for="category">选择专题</label>
      <select id="category"><option value="">全部专题</option></select>
      <p class="hint">传统 API 供 Rhino 查阅，其他引擎请看对应指南。</p>
      <div class="links"><a href="mcp-guide.html">MCP 指南</a><a href="index.html">传统目录</a></div>
    </div>
  </header>
  <main>
    <div class="result-bar">
      <p id="status" role="status" aria-live="polite">正在加载…</p>
      <button id="collapse-all" class="quiet" type="button">全部收起</button>
    </div>
    <div id="results"></div>
    <p id="empty" hidden>没有找到相关条目。试试方法名的一部分，或切换引擎与专题。</p>
    <button id="more" type="button" hidden>显示更多</button>
    <p class="footnote">参考条目不代表全部接口已实现，兼容差异以正文为准。</p>
    <noscript><p>当前查看器未启用文档搜索，可从<a href="index.html">传统 API 目录</a>查阅完整章节。</p></noscript>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
